services:
  db:
    image: postgres:16-alpine
    container_name: klao-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    image: oven/bun:latest
    container_name: klao-core
    working_dir: /app/packages/core
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/postgres?schema=core
      - NEXTAUTH_SECRET=development-secret-only
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - .:/app
    command: sh -c "bun x prisma generate && bun run dev"

  console:
    image: oven/bun:latest
    container_name: klao-console
    working_dir: /app/packages/console
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    command: sh -c "bun run dev -- --host"

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    container_name: sails-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/full_database_backup.sql:/docker-entrypoint-initdb.d/01-restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: packages/core/Dockerfile
    image: sails-core:latest
    container_name: sails-core
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/postgres?schema=core
      - NEXTAUTH_SECRET=development-secret-only
      - NEXTAUTH_URL=http://localhost:5173
      - GOOGLE_CLIENT_ID=your-google-client-id
      - GOOGLE_CLIENT_SECRET=your-google-client-secret
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/core/node_modules
      - /app/packages/console/node_modules
      - /app/packages/shared/node_modules
    command: sh -c "cd packages/core && bun prisma generate && bun run dev"

  console:
    build:
      context: .
      dockerfile: packages/console/Dockerfile
    image: sails-console:latest
    container_name: sails-console
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/core/node_modules
      - /app/packages/console/node_modules
      - /app/packages/shared/node_modules
    environment:
      - VITE_CORE_URL=http://localhost:3000
    command: sh -c "cd packages/console && bun run dev -- --host"

volumes:
  pgdata:

    .attr("stroke", "#1e293b")
    .attr("stroke-width", 1.5)
    .attr("opacity", 0.85)
    .style("cursor", "pointer")
    .call(drag(simulation));

// Node labels
const labels = g.append("g")
    .selectAll("text")
    .data(graphData.nodes.filter(d => (degreeMap[d.id] || 0) > minDegree * 1.5))
    .join("text")
    .text(d => d.label)
    .attr("font-size", d => Math.min(11, 6 + nodeScale(degreeMap[d.id] || 1) * 0.3))
    .attr("fill", "#94a3b8")
    .attr("text-anchor", "middle")
    .attr("dy", d => nodeScale(degreeMap[d.id] || 1) + 4)
    .attr("pointer-events", "none")
    .style("font-family", "system-ui, sans-serif");

// Tooltip events
node.on("mouseover", function(event, d) {
    const degree = degreeMap[d.id] || 0;
    const comId = d.communities ? d.communities[0] : 0;
    const comName = communityLabels[comId] || `Community ${comId}`;
    tooltip
        .style("opacity", 1)
        .html(`<div class="tt-label">${d.label}</div>
              <div class="tt-type">${d.type || 'Unknown'} · ${comName}</div>
              <div class="tt-type">Degree: ${degree} · Centrality: ${(degree / maxDegree).toFixed(3)}</div>
              ${d.source_location ? `<div class="tt-file">${d.source_location}</div>` : ''}`)
        .style("left", (event.pageX + 15) + "px")
        .style("top", (event.pageY - 10) + "px");
    d3.select(this).attr("opacity", 1).attr("stroke", "#f1f5f9").attr("stroke-width", 2);
})
.on("mouseout", function() {
    tooltip.style("opacity", 0);
    d3.select(this).attr("stroke", "#1e293b").attr("stroke-width", 1.5).attr("opacity", 0.85);
});

simulation.on("tick", () => {
    link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
    node
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);
    labels
        .attr("x", d => d.x)
        .attr("y", d => d.y);
});

function drag(simulation) {
    function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }
    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
    }
    function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
    }
    return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
}

// Build legend
const legendEl = d3.select("#legend");
const communities = {};
graphData.nodes.forEach(n => {
    const cid = n.communities ? n.communities[0] : 0;
    if (!communities[cid]) {
        communities[cid] = { count: 0, color: communityColor(cid) };
    }
    communities[cid].count++;
});

Object.entries(communities).sort((a,b) => b[1].count - a[1].count).forEach(([cid, info]) => {
    const comName = communityLabels[cid] || `Community ${cid}`;
    legendEl.append("div")
        .attr("class", "legend-item")
        .html(`<div class="legend-dot" style="background:${info.color}"></div><div class="legend-label">${comName} (${info.count})</div>`);
});

// Counts
const totalNodes = graphData.nodes.length;
const totalLinks = graphData.links.length;
d3.select("#counts").html(`Nodes: <span>${totalNodes}</span> · Edges: <span>${totalLinks}</span> · Communities: <span>${Object.keys(communities).length}</span>`);
</script>
</body>
</html>
